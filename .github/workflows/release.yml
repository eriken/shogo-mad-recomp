# Builds Shogo.app on macOS and packs it into a .dmg: for a v* tag (attached
# to a GitHub Release) or when run by hand (kept as a workflow artifact).
# (Not on every push: a private repository's macOS minutes count ten times.)
#
# Monolith's game source isn't in this repository (its licence forbids sharing
# it), so the build reads the original download, shogo_sourcecode22.zip, from
# a private repository (SHOGO_SOURCE_REPO) with a read-only deploy key
# (secret SHOGO_SOURCE_DEPLOY_KEY). The source is only unpacked in the runner's
# workspace: nothing here uploads it, and the dmg holds only compiled code.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # creating the Release for a tag

env:
  SHOGO_SOURCE_REPO: eriken/shogo-mad-source
  SHOGO_SOURCE_MD5: 2c13c09931bc803f3af6e6782ec2df80

jobs:
  build:
    runs-on: macos-15  # Apple silicon; Homebrew's SDL3 there needs macOS 15+
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the Shogo v2.2 source (private)
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SHOGO_SOURCE_REPO }}
          ssh-key: ${{ secrets.SHOGO_SOURCE_DEPLOY_KEY }}
          path: _shogo_source
          persist-credentials: false

      - name: Unpack the source
        run: |
          echo "$SHOGO_SOURCE_MD5  _shogo_source/shogo_sourcecode22.zip" | md5sum -c - 2>/dev/null \
            || [ "$(md5 -q _shogo_source/shogo_sourcecode22.zip)" = "$SHOGO_SOURCE_MD5" ]
          mkdir -p third_party/shogsrc22/installer
          unzip -q _shogo_source/shogo_sourcecode22.zip -d third_party/shogsrc22/installer
          python3 -I tools/is3extract.py third_party/shogsrc22/installer/data.z third_party/shogsrc22/source >/dev/null
          rm -rf _shogo_source

      - name: Install SDL3
        run: brew install sdl3

      # The Developer ID certificate (secrets DEVELOPER_ID_P12, base64 of the
      # .p12, and DEVELOPER_ID_P12_PASSWORD) goes into a keychain of its own
      # that lives only as long as this job. A tag needs it; a run by hand
      # without it builds an ad-hoc signed app, as before.
      - name: Import the signing certificate
        id: sign
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            case "$GITHUB_REF" in refs/tags/v*) echo "::error::a release needs the DEVELOPER_ID_P12 secrets"; exit 1 ;; esac
            echo "No signing certificate: ad-hoc signature, not notarized."
            exit 0
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KC_PASSWORD" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASSWORD" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASSWORD" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | awk '/Developer ID Application/ { print $2; exit }')
          [ -n "$IDENTITY" ] || { echo "::error::no Developer ID Application identity in the .p12"; exit 1; }
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DSHOGO_SIGN_IDENTITY="${{ steps.sign.outputs.identity }}"
          cmake --build build -j "$(sysctl -n hw.ncpu)"

      - name: Test (without game data)
        run: ./build/shogo-engine-tests

      - name: Make the disk image
        id: dmg
        env:
          SHOGO_SIGN_IDENTITY: ${{ steps.sign.outputs.identity }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' build/Shogo.app/Contents/Info.plist)
          case "$GITHUB_REF" in refs/tags/v*) NAME="Shogo-${GITHUB_REF_NAME#v}" ;; *) NAME="Shogo-$VERSION-$(git rev-parse --short HEAD)" ;; esac
          tools/make_dmg.sh build "build/$NAME.dmg"
          echo "path=build/$NAME.dmg" >> "$GITHUB_OUTPUT"

      # Notarization with an App Store Connect API key: secrets NOTARY_KEY
      # (the AuthKey_*.p8 file's text), NOTARY_KEY_ID and NOTARY_ISSUER.
      - name: Notarize
        if: steps.sign.outputs.identity != ''
        env:
          KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          # Pasted IDs can carry stray spaces or line breaks; say what's wrong
          # (without the value) when the issuer isn't a UUID.
          export NOTARY_KEY_ID=$(printf %s "$NOTARY_KEY_ID" | tr -d '[:space:]')
          export NOTARY_ISSUER=$(printf %s "$NOTARY_ISSUER" | tr -d '[:space:]')
          if ! printf %s "$NOTARY_ISSUER" | grep -Eqi '^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$'; then
            echo "::error::NOTARY_ISSUER isn't an Issuer ID: ${#NOTARY_ISSUER} characters, expected 36 like xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
            exit 1
          fi
          export NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          printf '%s\n' "$KEY" > "$NOTARY_KEY"
          tools/notarize.sh "${{ steps.dmg.outputs.path }}"
          rm -f "$NOTARY_KEY"

      - uses: actions/upload-artifact@v7
        with:
          name: shogo-dmg
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.dmg.outputs.path }}" --title "Shogo $GITHUB_REF_NAME" \
            --notes "Needs your own copy of Shogo: Mobile Armor Division from GOG or Steam: open the app and import GOG's installer, or the Steam download (the launcher shows how to get it).

          Made by Erik Wessel (shogo-recomp.unlocking364@passmail.net). THIS PORT IS NOT MADE BY OR SUPPORTED BY Monolith Productions, or any of its affiliates and subsidiaries."

      - name: Remove the signing keychain
        if: always() && steps.sign.outputs.identity != ''
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db"
